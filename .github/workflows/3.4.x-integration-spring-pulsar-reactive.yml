name: 3.4.x | Integration Smoke Tests | Spring Pulsar Reactive
on:
  workflow_run:
    workflows: ["3.4.x | Warm Caches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  spring_pulsar_reactive_app_test:
    name: Spring Pulsar Reactive App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: integration:spring-pulsar-reactive
      task: appTest
  spring_pulsar_reactive_native_app_test:
    name: Spring Pulsar Reactive Native App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: integration:spring-pulsar-reactive
      task: nativeAppTest
