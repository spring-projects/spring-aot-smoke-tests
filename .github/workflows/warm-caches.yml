name: Smoke Test
on:
  workflow_call:
    inputs:
      checkout_repository:
        required: true
        type: string
      checkout_ref:
        required: true
        type: string
permissions:
  contents: read
  actions: write
jobs:
  warm_caches:
    name: ${{ inputs.task }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          repository: ${{ inputs.checkout_repository }}
          ref: ${{ inputs.checkout_ref }}
      - name: Record date
        id: date
        run: echo "today=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'liberica'
          cache-jdk: true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0
        with:
          cache-disabled: true
      - name: Configure Gradle user.name
        run: |
           mkdir -p ~/.gradle
           echo 'systemProp.user.name=spring-builds+github' >> ~/.gradle/gradle.properties
      # A new key each day sidesteps GitHub's cache key immutability; restore-keys falls back to
      # the most recent entry for this branch.
      - name: Restore/save Gradle wrapper and dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches/modules-2
          key: gradle-deps-${{ inputs.checkout_ref }}-${{ steps.date.outputs.today }}
          restore-keys: |
            gradle-deps-${{ inputs.checkout_ref }}-
      # Older dated entries for this branch will never be restored again - delete them so they
      # don't waste cache quota.
      - name: Delete stale Gradle dependency caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stale=$(gh cache list --repo ${{ github.repository }} \
            --key "gradle-deps-${{ inputs.checkout_ref }}-" \
            --json id,key \
            --jq '.[] | select(.key != "gradle-deps-${{ inputs.checkout_ref }}-${{ steps.date.outputs.today }}")')
          echo "Cache entries to delete:"
          echo "$stale"
          echo "$stale" | jq -r '.id' | xargs -r -n1 gh cache delete --repo ${{ github.repository }}
        continue-on-error: true
      - name: Warm Caches
        env:
          DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
          REPO_SPRING_IO_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          REPO_SPRING_IO_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
        run: ./gradlew warmCaches --continue
