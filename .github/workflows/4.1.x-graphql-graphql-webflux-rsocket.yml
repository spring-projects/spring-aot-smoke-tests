name: 4.1.x | Graphql Smoke Tests | Graphql Webflux Rsocket
on:
  workflow_run:
    workflows: ["4.1.x | Warm Caches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graphql_webflux_rsocket_app_test:
    name: Graphql Webflux Rsocket App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: graphql:graphql-webflux-rsocket
      task: appTest
  graphql_webflux_rsocket_native_app_test:
    name: Graphql Webflux Rsocket Native App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: graphql:graphql-webflux-rsocket
      task: nativeAppTest
      graal_version: 25
  graphql_webflux_rsocket_test:
    name: Graphql Webflux Rsocket Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: graphql:graphql-webflux-rsocket
      task: test
  graphql_webflux_rsocket_native_test:
    name: Graphql Webflux Rsocket Native Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: graphql:graphql-webflux-rsocket
      task: nativeTest
      graal_version: 25
