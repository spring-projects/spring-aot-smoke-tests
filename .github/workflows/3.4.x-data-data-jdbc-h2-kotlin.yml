name: 3.4.x | Data Smoke Tests | Data Jdbc H2 Kotlin
on:
  workflow_run:
    workflows: ["3.4.x | Warm Caches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data_jdbc_h2_kotlin_app_test:
    name: Data Jdbc H2 Kotlin App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: data:data-jdbc-h2-kotlin
      task: appTest
  data_jdbc_h2_kotlin_native_app_test:
    name: Data Jdbc H2 Kotlin Native App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: data:data-jdbc-h2-kotlin
      task: nativeAppTest
  data_jdbc_h2_kotlin_test:
    name: Data Jdbc H2 Kotlin Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: data:data-jdbc-h2-kotlin
      task: test
  data_jdbc_h2_kotlin_native_test:
    name: Data Jdbc H2 Kotlin Native Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 3.4.x
      project: data:data-jdbc-h2-kotlin
      task: nativeTest
      java_version: 22
      graal_version: 22
