name: 4.0.x | Cloud Smoke Tests | Cloud Discovery Eureka
on:
  workflow_run:
    workflows: ["4.0.x | Warm Caches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud_discovery_eureka_app_test:
    name: Cloud Discovery Eureka App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 4.0.x
      project: cloud:cloud-discovery-eureka
      task: appTest
  cloud_discovery_eureka_native_app_test:
    name: Cloud Discovery Eureka Native App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: 4.0.x
      project: cloud:cloud-discovery-eureka
      task: nativeAppTest
      graal_version: 25
