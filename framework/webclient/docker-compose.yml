services:
  httpbin:
    image: 'mccutchen/go-httpbin:2.25.0'
    environment:
      - 'SRV_READ_HEADER_TIMEOUT=5s'
    ports:
      - '8080'
  httpbin_tls:
    image: 'mccutchen/go-httpbin:2.25.0'
    environment:
      - 'PORT=8443'
      - 'SRV_READ_HEADER_TIMEOUT=5s'
      - 'HTTPS_CERT_FILE=/server-certificate'
      - 'HTTPS_KEY_FILE=/server-key'
    configs:
      - 'server-certificate'
      - 'server-key'
    ports:
      - '8443'
configs:
  server-certificate:
    file: './server.crt'
  server-key:
    file: './server.key'
