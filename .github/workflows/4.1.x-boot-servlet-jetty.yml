name: 4.1.x | Boot Smoke Tests | Servlet Jetty
on:
  workflow_run:
    workflows: ["4.1.x | Warm Caches"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  servlet_jetty_app_test:
    name: Servlet Jetty App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-jvm.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: boot:servlet-jetty
      task: appTest
  servlet_jetty_native_app_test:
    name: Servlet Jetty Native App Test
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/smoke-test-native.yml
    secrets: inherit
    with:
      checkout_repository: spring-projects/spring-aot-smoke-tests
      checkout_ref: main
      project: boot:servlet-jetty
      task: nativeAppTest
      graal_version: 25
